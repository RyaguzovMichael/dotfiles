#######################
### STYLE VARIABLES ###
#######################

$nrd_bck            = rgba(2E3440FF)
$nrd_bck_element    = rgba(3B4251FF)
$nrd_bck_active     = rgba(434C5EFF)
$nrd_bck_accent     = rgba(4C566AFF)
$nrd_txt_active     = rgba(D8DEE9FF)
$nrd_txt            = rgba(E5E9F0FF)
$nrd_txt_accent     = rgba(ECEFF4FF)
$nrd_ui_accent      = rgba(8FBCBBFF)
$nrd_ui_main        = rgba(88C0D0FF)
$nrd_ui_secondary   = rgba(81A1C1FF)
$nrd_ui_tertiary    = rgba(5E81ACFF)
$nrd_error          = rgba(BF616AFF)
$nrd_danger         = rgba(D08770FF)
$nrd_warning        = rgba(EBCB8BFF)
$nrd_success        = rgba(A3BE8CFF)
$nrd_uncommon       = rgba(B48EADFF)

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto
monitor=DP-1,2560x1440@60.0,0x0,1.0

###################
### MY PROGRAMS ###
###################

$terminal   = kitty
$menu       = wofi

#################
### AUTOSTART ###
#################
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP

exec-once = swaync &
exec-once = hyprpaper &
exec-once = /usr/bin/steam -silent -gamepadui -steamos3 &

exec-once = /usr/bin/gnome-keyring-daemon --daemonize --replace --components=secret &

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,18
env = HYPRCURSOR_SIZE,18
env = NO_AT_BRIDGE,1

#####################
### LOOK AND FEEL ###
#####################

# https://wiki.hypr.land/Configuring/Variables/
general {
    border_size = 5
    gaps_in = 0
    gaps_out = 0
    col.active_border = $nrd_ui_main
    col.inactive_border = $nrd_bck_element
    layout = dwindle
    allow_tearing = false
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    shadow {
        enabled = false 
    }
    blur {
        enabled = false 
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    background_color = $nrd_bck
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout=us,ru
    kb_options=grp:win_space_toggle,caps:none

    follow_mouse = 0
}

ecosystem {
    no_update_news=true
}

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

bind = $mainMod SHIFT, Q, exit
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, R, exec, $menu
bind = $mainMod, F, fullscreen,
bind = $mainMod, A, fullscreen, 1

# Move focus with mainMod
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, 
bind = $mainMod, J, movefocus, d

# Move to workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, G, workspace, 9
bind = $mainMod, TAB, workspace, e+1

# Move window submap
bind = $mainMod, M, exec, hyprctl 'keyword general:col.active_border $nrd_danger'
bind = $mainMod, M, submap, window_moving
submap = window_moving
bind = , H, movewindow, l
bind = , L, movewindow, r
bind = , K, movewindow, u
bind = , J, movewindow, d
binde = CTRL, L, resizeactive, 30 0
binde = CTRL, H, resizeactive, -30 0
binde = CTRL, K, resizeactive, 0 -30
binde = CTRL, J, resizeactive, 0 30
bind = , 1, movetoworkspace, 1
bind = , 2, movetoworkspace, 2
bind = , 3, movetoworkspace, 3
bind = , 4, movetoworkspace, 4
bind = , 5, movetoworkspace, 5
bind = , escape, exec, hyprctl 'keyword general:col.active_border $nrd_ui_main'
bind = , escape, submap, reset
submap = reset

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Custom
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class *

# Steam: route every Steam window to workspace 9 and switch to it when one
# opens. A "special" workspace made Chromium-based steamwebhelper treat itself
# as occluded/minimized and stop handling controller guide-button input, so a
# plain normal workspace is used instead (always fully rendered, no throttling).
windowrule = workspace 9 silent, match:class ^(steam)$

